# Preview-deploy → Azure Static Web App `swa-rmdsp-tst` (ram-rg-rm-tst),
# https://salmon-desert-09cfbed03.7.azurestaticapps.net
#
# Alleen op pull requests naar main. Elke PR krijgt een eigen staging-omgeving op
# de testomgeving; bij het sluiten van de PR wordt die opgeruimd. Push naar main
# gaat naar deploy-production.yml.
#
# NB: swa-rmdsp-tst zit op het Free-plan, met maximaal drie staging-omgevingen
# tegelijk. Meer openstaande PR's dan dat → de vierde faalt.
name: Deploy preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       contents: read
       pull-requests: write    # nodig om de preview-URL als PR-comment te plaatsen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Zelfde split-build als productie: Oryx ziet de env-vars van de
      # deploy-action niet, dus bouwen we hier expliciet.
      #
      # De VITE_*-secrets zijn dezelfde als voor productie — een preview praat dus
      # met de productie-API en de productie-Entra-app. Wil je dat scheiden, dan
      # zijn daar aparte secrets voor nodig (en een extra redirect-URI in Entra
      # voor de staging-hostnames).
      - name: Build App
        run: npm run build
        env:
          VITE_RAM_API_BASE_URL: ${{ secrets.VITE_RAM_API_BASE_URL }}
          VITE_SEASONAL_API_BASE_URL: ${{ secrets.VITE_SEASONAL_API_BASE_URL }}
          VITE_ENTRA_TENANT_NAME: ${{ secrets.VITE_ENTRA_TENANT_NAME }}
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_AUTHORITY_URL: ${{ secrets.VITE_ENTRA_AUTHORITY_URL }}
          VITE_ENTRA_USER_FLOW: ${{ secrets.VITE_ENTRA_USER_FLOW }}

      # Geen github_id_token, om dezelfde reden als in deploy-production.yml: met
      # OIDC bepaalt de repo-koppeling in Azure de doel-app en wordt het token
      # genegeerd. Hier moet het token beslissen, anders landt een preview alsnog
      # ergens anders.
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_DESERT_09CFBED03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}    # plaatst de preview-URL als PR-comment
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "dist"    # al-gebuilde static output
          api_location: ""
          output_location: ""     # niet gebruikt wanneer skip_app_build true is
          skip_app_build: true    # Oryx skippen; we hebben zelf gebouwd
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_DESERT_09CFBED03 }}
          action: "close"
